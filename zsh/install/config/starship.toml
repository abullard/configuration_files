add_newline = false
format = '📁 $directory@ $time$git_branch$git_status$character'
right_format = '${custom.inspiration}'

[custom.inspiration]
command = 'echo $INSPIRE_LINE'
style = 'bright-yellow'
description = 'inspiration!'

[directory]
truncation_length = 3
truncation_symbol = '../'
truncate_to_repo = false
repo_root_style = 'bold underline cyan'

[time]
format='[\[🕑 $time\]](fg:yellow) '
disabled = false
time_format = '%T'

[git_branch]
symbol = 'git:'

[git_status]
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'
stashed = '\$${count}'

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
